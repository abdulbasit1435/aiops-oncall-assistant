apiVersion: v1
kind: ServiceAccount
metadata:
  name: oncall-assistant
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oncall-assistant-readonly
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oncall-assistant-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oncall-assistant-readonly
subjects:
- kind: ServiceAccount
  name: oncall-assistant
  namespace: aiops
